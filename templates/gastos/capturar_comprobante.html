{% extends "admin/base_site.html" %}
{% block content %}
<div class="max-w-xl mx-auto py-8">
  <div class="bg-white border border-slate-200 rounded-2xl shadow-sm overflow-hidden">
    <div class="p-6 bg-gradient-to-r from-emerald-700 to-teal-700 text-white"><h1 class="text-2xl font-bold">Capturar comprobante</h1><p class="mt-1 text-emerald-100">Toma una foto clara del ticket o elige una de tu galer?a.</p></div>
    <form method="post" enctype="multipart/form-data" class="p-6 space-y-6">
      {% csrf_token %}
      {% if form.comprobante.errors %}<p class="text-red-700">{{ form.comprobante.errors.0 }}</p>{% endif %}
      <label for="id_comprobante" class="block cursor-pointer border-2 border-dashed border-emerald-300 rounded-xl bg-emerald-50 p-10 text-center hover:bg-emerald-100">
        <span class="block text-lg font-semibold text-emerald-900">Abrir c?mara o seleccionar foto</span>
        <span class="block mt-2 text-sm text-emerald-700">JPG, PNG o WEBP ? m?ximo 10 MB</span>
      </label>
      <div class="hidden">{{ form.comprobante }}</div>
      <p id="file-name" class="text-sm text-slate-600" aria-live="polite"></p>
      <div class="flex justify-between gap-4"><a href="{% url 'admin:index' %}" class="px-4 py-2 border rounded-lg">Cancelar</a><button class="px-5 py-2 bg-emerald-700 text-white rounded-lg font-semibold">Enviar a revisi?n</button></div>
    </form>
  </div>
</div>
<script>document.getElementById('id_comprobante').addEventListener('change', e => document.getElementById('file-name').textContent = e.target.files[0] ? e.target.files[0].name : '');</script>
{% endblock %}
