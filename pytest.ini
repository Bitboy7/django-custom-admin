[pytest]
DJANGO_SETTINGS_MODULE = app.settings
python_files = tests*.py test_*.py *_tests.py tests_integration.py
python_classes = Test*
python_functions = test_*
addopts =
    --tb=short
    --strict-markers
markers =
    slow: tests that take longer or require integration resources
    performance: tests that measure load or runtime characteristics
filterwarnings =
    ignore::DeprecationWarning
